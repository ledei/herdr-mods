[package]
name = "herdr-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"

[dependencies]
base64 = "0.23.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
debug = false
strip = true
